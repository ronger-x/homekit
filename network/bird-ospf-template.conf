# BIRD 2.x Configuration for OSPF-based Split Routing
# Historical reference only: the OSPF split-routing design is retired.
# Location: /etc/bird/bird.conf
# Description: Advertise non-China IP routes to RouterOS via OSPF

log syslog all;
router id 192.168.88.250;

# Kernel protocol - sync routes between BIRD and kernel routing table
protocol kernel {
    scan time 60;
    ipv4 {
        import none;       # Don't import kernel routes into BIRD
        export all;        # Export all BIRD routes to kernel
    };
}

protocol kernel {
    scan time 60;
    ipv6 {
        import none;
        export all;
    };
}

# Device protocol - track network interface state
protocol device {
    scan time 60;
}

# Static routes - non-China IPv4 addresses
protocol static overseas4 {
    ipv4;
    # Include nchnroutes generated file
    include "/etc/bird/routes4.conf";
}

# Static routes - non-China IPv6 addresses
protocol static overseas6 {
    ipv6;
    # Include nchnroutes generated file
    include "/etc/bird/routes6.conf";
}

# OSPFv2 instance for IPv4
protocol ospf v2 default_v2 {
    ipv4 {
        import none;                        # Don't accept routes from RouterOS
        export where source = RTS_STATIC;   # Only export static routes
    };

    area 0.0.0.0 {
        interface "eth0" {
            type broadcast;
            cost 10;
            hello 10;           # Hello interval (seconds)
            dead 40;            # Dead interval (seconds)
            retransmit 5;       # Retransmit interval (seconds)
            wait 40;            # Wait interval (seconds)
            priority 1;         # OSPF priority (lower than RouterOS)

            # Authentication - must match RouterOS config
            authentication cryptographic;
            password "CHANGE_THIS_PASSWORD";
        };
    };
}

# OSPFv3 instance for IPv6
protocol ospf v3 default_v3 {
    ipv6 {
        import none;
        export where source = RTS_STATIC;
    };

    area 0.0.0.0 {
        interface "eth0" {
            type broadcast;
            cost 10;
            hello 10;
            dead 40;

            # OSPFv3 authentication not supported on RouterOS 7.x yet
            # Leave authentication disabled
        };
    };
}
