#!/usr/sbin/nft -f
# nftables Configuration for OSPF Split Routing
# Historical reference only: the OSPF split-routing design is retired.
# Location: /etc/nftables.conf
# Description: NAT and forwarding rules for tunnel traffic (sing-box TUN or WireGuard)

flush ruleset

# inet family applies to both IPv4 and IPv6
table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;

        # Accept all input traffic (adjust if you need stricter security)
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # MSS clamping - critical for tunnel MTU issues
        # Prevents packet fragmentation and connection stalls
        tcp flags syn tcp option maxseg size set rt mtu

        # Allow established and related connections
        ct state { established, related } accept

        # Allow LAN (eth0) to tunnel (tun0/wg0) forwarding
        iif "eth0" oifname "tun0" accept
        # iif "eth0" oifname "wg0" accept  # Uncomment for WireGuard

        # Allow tunnel -> LAN return traffic
        iif "tun0" oifname "eth0" accept
        # iif "wg0" oifname "eth0" accept  # Uncomment for WireGuard
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# NAT table for source address translation
table inet nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # SNAT for outbound traffic to tunnel
        # LAN clients -> tunnel: masquerade source IP
        oifname "tun0" masquerade
        # oifname "wg0" masquerade  # Uncomment for WireGuard

        # CRITICAL: SNAT for return traffic to LAN
        # Without this, RouterOS connection tracking will drop return packets
        # because it expects source IP to be the container, not the remote server
        oifname "eth0" ip daddr 192.168.88.0/24 masquerade
    }
}


# --------------------------------------------------
# Deployment Steps:
# --------------------------------------------------
# 1. Copy this file to /etc/nftables.conf
# 2. Make executable: chmod +x /etc/nftables.conf
# 3. Enable service: systemctl enable nftables
# 4. Start service: systemctl start nftables
# 5. Verify rules: nft list ruleset
#
# --------------------------------------------------
# Key Configuration Notes:
# --------------------------------------------------
# 1. MSS Clamping: Required to prevent MTU blackhole issues
#    - Syntax: tcp flags syn tcp option maxseg size set rt mtu
#    - Must be placed BEFORE connection tracking rules
#
# 2. Bidirectional Forwarding:
#    - eth0 -> tun0: Allow LAN clients to send to tunnel
#    - tun0 -> eth0: Allow tunnel return traffic to LAN
#
# 3. Double SNAT (CRITICAL):
#    - Outbound (eth0->tun0): Masquerade LAN client IPs
#    - Inbound (tun0->eth0): Masquerade remote server IPs
#    - Without inbound SNAT, RouterOS connection tracking drops return packets
#      because it expects source IP = container IP, not remote server IP
#
# --------------------------------------------------
# Testing:
# --------------------------------------------------
# - Test HTTP: curl -I http://hk.100token.sh
# - Test HTTPS: curl -I https://hk.100token.sh
# - Check NAT: tcpdump -i tun0 -n (should see 172.19.0.1 as source)
# - Verify return SNAT: tcpdump -i eth0 -n host 192.168.88.x
#   (should see 192.168.88.250 as source for return traffic)
#
# --------------------------------------------------
# Troubleshooting:
# --------------------------------------------------
# Symptom: HTTP works but HTTPS times out
# - Cause: Missing inbound SNAT rule
# - Fix: Add "oifname eth0 ip daddr 192.168.88.0/24 masquerade"
#
# Symptom: Connections stall after initial handshake
# - Cause: MTU/MSS issues
# - Fix: Verify MSS clamping rule is active and placed first
