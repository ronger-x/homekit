# WireGuard Configuration Template
# Historical reference only: the OSPF split-routing design is retired.
# Location: /etc/wireguard/wg0.conf
# Description: Tunnel configuration for OSPF split routing

[Interface]
# Private key generated with: wg genkey
# Generate: wg genkey | tee privatekey | wg pubkey > publickey
PrivateKey = <CLIENT_PRIVATE_KEY>

# Tunnel IP address assigned by VPN server
Address = <TUNNEL_IPV4>/32, <TUNNEL_IPV6>/128

# MTU setting (adjust if experiencing fragmentation issues)
MTU = 1420

# Optional: Custom DNS for tunnel interface
# DNS = 8.8.8.8, 1.1.1.1

[Peer]
# VPN server's public key
PublicKey = <SERVER_PUBLIC_KEY>

# VPN server endpoint
Endpoint = <SERVER_IP>:<SERVER_PORT>

# AllowedIPs - use split ranges to avoid overriding default route
# 0.0.0.0/1 covers 0.0.0.0 - 127.255.255.255
# 128.0.0.0/1 covers 128.0.0.0 - 255.255.255.255
# This allows BIRD to control routing via OSPF
AllowedIPs = 0.0.0.0/1, 128.0.0.0/1, ::/1, 8000::/1

# Keep connection alive through NAT
PersistentKeepalive = 25

# --------------------------------------------------
# Configuration Steps:
# --------------------------------------------------
# 1. Generate keys on the container:
#    wg genkey | tee /etc/wireguard/privatekey | wg pubkey > /etc/wireguard/publickey
#
# 2. Replace placeholders:
#    - <CLIENT_PRIVATE_KEY>: Content of /etc/wireguard/privatekey
#    - <TUNNEL_IPV4>: IPv4 address assigned by VPN provider (e.g., 10.0.0.2)
#    - <TUNNEL_IPV6>: IPv6 address assigned by VPN provider (optional)
#    - <SERVER_PUBLIC_KEY>: VPN server's public key
#    - <SERVER_IP>: VPN server's public IP or hostname
#    - <SERVER_PORT>: VPN server's WireGuard port (usually 51820)
#
# 3. Set correct permissions:
#    chmod 600 /etc/wireguard/wg0.conf
#
# 4. Start WireGuard:
#    systemctl enable wg-quick@wg0
#    systemctl start wg-quick@wg0
#
# 5. Verify connection:
#    wg show
#    ping -I wg0 1.1.1.1
#
# --------------------------------------------------
# Important Notes:
# --------------------------------------------------
# - AllowedIPs uses split /1 ranges instead of 0.0.0.0/0 to preserve
#   the default route through eth0 for LAN traffic
# - BIRD will install specific routes for non-China IPs pointing to wg0
# - The tunnel server IP must be excluded from nchnroutes generation
#   to avoid routing loops (add --exclude <SERVER_IP>/32 when generating routes)
